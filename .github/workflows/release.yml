name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          binary_name="subserver_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            binary_name="${binary_name}.exe"
          fi
          echo "binary_name=$binary_name" >> $GITHUB_ENV
          go build -ldflags="-s -w" -o "$binary_name" .

      - name: Create release archive
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "${{ env.binary_name }}.zip" "${{ env.binary_name }}"
            echo "asset_path=${{ env.binary_name }}.zip" >> $GITHUB_ENV
          else
            tar -czf "${{ env.binary_name }}.tar.gz" "${{ env.binary_name }}"
            echo "asset_path=${{ env.binary_name }}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Generate SHA256 checksum
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            sha256sum "${{ env.binary_name }}.zip" > "${{ env.binary_name }}.zip.sha256"
            echo "checksum_path=${{ env.binary_name }}.zip.sha256" >> $GITHUB_ENV
          else
            sha256sum "${{ env.binary_name }}.tar.gz" > "${{ env.binary_name }}.tar.gz.sha256"
            echo "checksum_path=${{ env.binary_name }}.tar.gz.sha256" >> $GITHUB_ENV
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ env.asset_path }}
            ${{ env.checksum_path }}

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          merge-multiple: true

      - name: Generate release notes
        run: |
          TAG=${{ github.ref_name }}
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 $TAG^ 2>/dev/null || echo "")

          echo "## 发布说明" > release_notes.md
          echo "" >> release_notes.md

          if [ -n "$PREVIOUS_TAG" ]; then
            echo "### 更新内容" >> release_notes.md
            echo "" >> release_notes.md
            git log --pretty=format:"- %s" "$PREVIOUS_TAG".."$TAG" >> release_notes.md
          else
            echo "### 首次发布" >> release_notes.md
          fi

          echo "" >> release_notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256
          body_path: release_notes.md
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
