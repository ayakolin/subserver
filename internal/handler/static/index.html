<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本文件分享</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-hover: #059669;
            --primary-light: #d1fae5;
            --text: #1f2937;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --bg: #f9fafb;
            --card: #ffffff;
            --border: #e5e7eb;
            --error: #ef4444;
            --error-bg: #fef2f2;
            --warning: #f59e0b;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 50%, #f0fdf4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            line-height: 1.6;
        }

        .container {
            background: var(--card);
            padding: 40px;
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 600px;
        }

        .container.wide {
            max-width: 900px;
        }

        h1 {
            color: var(--text);
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.025em;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 32px;
        }

        /* 导航栏 */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .navbar-brand {
            font-size: 20px;
            font-weight: 600;
            color: var(--primary);
        }

        .navbar-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .navbar-user span {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* 按钮 */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-danger {
            background: var(--error);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        /* 表单 */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
            font-family: 'Monaco', 'Consolas', monospace;
        }

        /* 上传区域 */
        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--bg);
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .upload-area.dragover {
            border-color: var(--primary);
            background: var(--primary-light);
            transform: scale(1.01);
        }

        .upload-area input {
            display: none;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.8;
        }

        .upload-text {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* 选项 */
        .options {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .option label {
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        /* 消息 */
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background: var(--primary-light);
            color: #065f46;
            display: block;
        }

        .message.error {
            background: var(--error-bg);
            color: #991b1b;
            display: block;
        }

        /* 结果 */
        .result {
            margin-top: 24px;
            padding: 20px;
            background: var(--bg);
            border-radius: 12px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result-link {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .result-link input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            background: var(--card);
        }

        /* 认证表单 */
        .auth-form {
            max-width: 360px;
            margin: 0 auto;
        }

        .auth-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .auth-tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* 分享列表 */
        .shares-list {
            margin-top: 24px;
        }

        .share-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: var(--bg);
            border-radius: 12px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }

        .share-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .share-info {
            flex: 1;
            min-width: 0;
        }

        .share-name {
            font-weight: 500;
            color: var(--text);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .share-meta {
            font-size: 12px;
            color: var(--text-muted);
        }

        .share-actions {
            display: flex;
            gap: 8px;
            margin-left: 16px;
        }

        /* 标签页 */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0;
        }

        .tab {
            padding: 12px 20px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }

        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: var(--card);
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-header h2 {
            font-size: 20px;
            color: var(--text);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .modal-close:hover {
            color: var(--text);
        }

        /* 工具类 */
        .hidden {
            display: none !important;
        }

        .text-center {
            text-align: center;
        }

        .mt-4 {
            margin-top: 16px;
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- 未登录状态 -->
    <div id="authContainer" class="container">
        <div class="auth-form">
            <h1 class="text-center">欢迎使用</h1>
            <p class="subtitle text-center">文本文件分享服务</p>

            <div class="auth-tabs">
                <div class="auth-tab active" data-tab="login">登录</div>
                <div class="auth-tab" data-tab="register">注册</div>
            </div>

            <div id="message" class="message"></div>

            <!-- 登录表单 -->
            <form id="loginForm" class="auth-form-content">
                <div class="form-group">
                    <label for="loginUsername">用户名</label>
                    <input type="text" id="loginUsername" required minlength="3" maxlength="20">
                </div>
                <div class="form-group">
                    <label for="loginPassword">密码</label>
                    <input type="password" id="loginPassword" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%">登录</button>
            </form>

            <!-- 注册表单 -->
            <form id="registerForm" class="auth-form-content hidden">
                <div class="form-group">
                    <label for="registerUsername">用户名</label>
                    <input type="text" id="registerUsername" required minlength="3" maxlength="20">
                </div>
                <div class="form-group">
                    <label for="registerPassword">密码</label>
                    <input type="password" id="registerPassword" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%">注册</button>
            </form>
        </div>
    </div>

    <!-- 已登录状态 -->
    <div id="mainContainer" class="container wide hidden">
        <div class="navbar">
            <div class="navbar-brand">文本文件分享</div>
            <div class="navbar-user">
                <span id="welcomeUser"></span>
                <button id="logoutBtn" class="btn btn-secondary btn-sm">登出</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="upload">上传文件</button>
            <button class="tab" data-tab="text">文本输入</button>
            <button class="tab" data-tab="shares">我的分享</button>
        </div>

        <div id="message" class="message"></div>

        <!-- 上传文件 -->
        <div id="uploadTab" class="tab-content active">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <div class="upload-text">
                    <strong>点击上传</strong> 或将文件拖拽到这里
                </div>
                <input type="file" id="fileInput" accept=".yaml,.yml,.json,.txt,.toml,.xml,.ini,.env,.properties,.conf,.cfg,.config,.rc,.csv,.tsv,.sh,.bash,.zsh,Makefile,Dockerfile,Procfile,Gemfile,Rakefile">
            </div>

            <div class="options">
                <div class="option">
                    <input type="checkbox" id="onceCheckbox">
                    <label for="onceCheckbox">阅后即焚（读取一次后自动删除）</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="expireCheckbox">
                    <label for="expireCheckbox">设置过期时间：</label>
                    <select id="expireSelect" style="padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border);">
                        <option value="3600">1 小时</option>
                        <option value="86400" selected>24 小时</option>
                        <option value="604800">7 天</option>
                    </select>
                </div>
            </div>

            <div id="uploadResult" class="result">
                <p><strong>上传成功！</strong></p>
                <div class="result-link">
                    <input type="text" id="shareLink" readonly>
                    <button class="btn btn-primary btn-sm" id="copyLinkBtn">复制</button>
                    <button class="btn btn-secondary btn-sm" id="openLinkBtn">打开</button>
                </div>
            </div>
        </div>

        <!-- 文本输入 -->
        <div id="textTab" class="tab-content">
            <div class="form-group">
                <label for="textContent">输入文本内容</label>
                <textarea id="textContent" placeholder="在这里输入要分享的文本内容..."></textarea>
            </div>
            <div class="form-group">
                <label for="textFilename">文件名（可选）</label>
                <input type="text" id="textFilename" placeholder="例如：config.yaml">
            </div>

            <div class="options">
                <div class="option">
                    <input type="checkbox" id="textOnceCheckbox">
                    <label for="textOnceCheckbox">阅后即焚</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="textExpireCheckbox">
                    <label for="textExpireCheckbox">设置过期时间：</label>
                    <select id="textExpireSelect" style="padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border);">
                        <option value="3600">1 小时</option>
                        <option value="86400" selected>24 小时</option>
                        <option value="604800">7 天</option>
                    </select>
                </div>
            </div>

            <button class="btn btn-primary" id="submitTextBtn" style="margin-top: 16px;">创建分享</button>

            <div id="textResult" class="result">
                <p><strong>创建成功！</strong></p>
                <div class="result-link">
                    <input type="text" id="textShareLink" readonly>
                    <button class="btn btn-primary btn-sm" id="copyTextLinkBtn">复制</button>
                    <button class="btn btn-secondary btn-sm" id="openTextLinkBtn">打开</button>
                </div>
            </div>
        </div>

        <!-- 我的分享 -->
        <div id="sharesTab" class="tab-content">
            <div id="sharesList" class="shares-list">
                <p class="text-center" style="color: var(--text-muted);">加载中...</p>
            </div>
        </div>
    </div>

    <!-- 编辑分享模态框 -->
    <div id="editModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2>编辑分享内容</h2>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div id="editMessage" class="message"></div>
            <form id="editForm">
                <input type="hidden" id="editFileId">
                <div class="form-group">
                    <label>上传新文件</label>
                    <div class="upload-area" id="editUploadArea" style="padding: 24px;">
                        <div class="upload-text">
                            <strong>点击上传</strong> 新文件
                        </div>
                        <input type="file" id="editFileInput">
                    </div>
                </div>
                <div class="form-group">
                    <label>或输入新内容</label>
                    <textarea id="editContent" placeholder="输入新的文本内容..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%">保存更改</button>
            </form>
        </div>
    </div>

    <script>
        // 状态管理
        let authToken = localStorage.getItem('auth_token');
        let currentUser = null;

        // DOM 元素
        const authContainer = document.getElementById('authContainer');
        const mainContainer = document.getElementById('mainContainer');
        const messageEl = document.getElementById('message');
        const welcomeUserEl = document.getElementById('welcomeUser');

        // 初始化
        function init() {
            if (authToken) {
                checkAuth();
            } else {
                showAuth();
            }
        }

        // 检查认证状态
        async function checkAuth() {
            try {
                const res = await fetch('/api/user', {
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });
                if (res.ok) {
                    currentUser = await res.json();
                    showMain();
                } else {
                    logout();
                }
            } catch (e) {
                showAuth();
            }
        }

        // 显示认证界面
        function showAuth() {
            authContainer.classList.remove('hidden');
            mainContainer.classList.add('hidden');
        }

        // 显示主界面
        function showMain() {
            authContainer.classList.add('hidden');
            mainContainer.classList.remove('hidden');
            if (currentUser) {
                welcomeUserEl.textContent = '欢迎，' + currentUser.username;
            }
            loadShares();
        }

        // 显示消息
        function showMessage(msg, type) {
            messageEl.textContent = msg;
            messageEl.className = 'message ' + type;
            setTimeout(() => {
                messageEl.className = 'message';
            }, 5000);
        }

        // 登录
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    authToken = data.token;
                    localStorage.setItem('auth_token', authToken);
                    currentUser = data.user;
                    showMessage('登录成功！', 'success');
                    setTimeout(showMain, 500);
                } else {
                    showMessage(data.error || '登录失败', 'error');
                }
            } catch (e) {
                showMessage('网络错误', 'error');
            }
        });

        // 注册
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('registerUsername').value;
            const password = document.getElementById('registerPassword').value;

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    authToken = data.token;
                    localStorage.setItem('auth_token', authToken);
                    currentUser = data.user;
                    showMessage('注册成功！', 'success');
                    setTimeout(showMain, 500);
                } else {
                    showMessage(data.error || '注册失败', 'error');
                }
            } catch (e) {
                showMessage('网络错误', 'error');
            }
        });

        // 登出
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                await fetch('/api/logout', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });
            } catch (e) {}
            localStorage.removeItem('auth_token');
            authToken = null;
            currentUser = null;
            showAuth();
        });

        // 切换认证标签
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const tabName = tab.dataset.tab;
                document.getElementById('loginForm').classList.toggle('hidden', tabName !== 'login');
                document.getElementById('registerForm').classList.toggle('hidden', tabName !== 'register');
            });
        });

        // 切换主标签
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById(tab.dataset.tab + 'Tab').classList.add('active');
            });
        });

        // 文件上传
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) uploadFile(file);
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) uploadFile(file);
        });

        // 上传文件
        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);

            const once = document.getElementById('onceCheckbox').checked;
            const expire = document.getElementById('expireCheckbox').checked;

            if (expire) {
                formData.append('expire_seconds', document.getElementById('expireSelect').value);
            }
            if (once) {
                formData.append('once', 'true');
            }

            try {
                uploadArea.classList.add('loading');
                const res = await fetch('/upload', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + authToken },
                    body: formData
                });
                const data = await res.json();
                uploadArea.classList.remove('loading');

                if (res.ok) {
                    document.getElementById('shareLink').value = data.raw_url;
                    document.getElementById('uploadResult').classList.add('show');
                    showMessage('上传成功！', 'success');
                    loadShares(); // 刷新分享列表
                } else {
                    showMessage(data.error || '上传失败', 'error');
                }
            } catch (e) {
                uploadArea.classList.remove('loading');
                showMessage('网络错误', 'error');
            }
        }

        // 复制链接
        document.getElementById('copyLinkBtn').addEventListener('click', () => {
            const input = document.getElementById('shareLink');
            input.select();
            document.execCommand('copy');
            showMessage('链接已复制', 'success');
        });

        document.getElementById('openLinkBtn').addEventListener('click', () => {
            window.open(document.getElementById('shareLink').value, '_blank');
        });

        // 文本分享
        document.getElementById('submitTextBtn').addEventListener('click', async () => {
            const content = document.getElementById('textContent').value;
            const filename = document.getElementById('textFilename').value || 'text.txt';

            if (!content.trim()) {
                showMessage('请输入内容', 'error');
                return;
            }

            const blob = new Blob([content], { type: 'text/plain' });
            const formData = new FormData();
            formData.append('file', blob, filename);

            const once = document.getElementById('textOnceCheckbox').checked;
            const expire = document.getElementById('textExpireCheckbox').checked;

            if (expire) {
                formData.append('expire_seconds', document.getElementById('textExpireSelect').value);
            }
            if (once) {
                formData.append('once', 'true');
            }

            try {
                document.getElementById('submitTextBtn').classList.add('loading');
                const res = await fetch('/upload', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + authToken },
                    body: formData
                });
                const data = await res.json();
                document.getElementById('submitTextBtn').classList.remove('loading');

                if (res.ok) {
                    document.getElementById('textShareLink').value = data.raw_url;
                    document.getElementById('textResult').classList.add('show');
                    showMessage('创建成功！', 'success');
                    loadShares();
                } else {
                    showMessage(data.error || '创建失败', 'error');
                }
            } catch (e) {
                document.getElementById('submitTextBtn').classList.remove('loading');
                showMessage('网络错误', 'error');
            }
        });

        document.getElementById('copyTextLinkBtn').addEventListener('click', () => {
            const input = document.getElementById('textShareLink');
            input.select();
            document.execCommand('copy');
            showMessage('链接已复制', 'success');
        });

        document.getElementById('openTextLinkBtn').addEventListener('click', () => {
            window.open(document.getElementById('textShareLink').value, '_blank');
        });

        // 加载分享列表
        async function loadShares() {
            const listEl = document.getElementById('sharesList');
            try {
                const res = await fetch('/api/user/shares', {
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });
                const data = await res.json();

                if (res.ok && data.shares && data.shares.length > 0) {
                    listEl.innerHTML = data.shares.map(share => `
                        <div class="share-item">
                            <div class="share-info">
                                <div class="share-name">${escapeHtml(share.file_name) || '未命名文件'}</div>
                                <div class="share-meta">
                                    ${formatFileSize(share.file_size)} •
                                    创建于 ${formatDate(share.created_at)}
                                </div>
                            </div>
                            <div class="share-actions">
                                <button class="btn btn-secondary btn-sm" onclick="viewShare('${share.file_id}')">查看</button>
                                <button class="btn btn-primary btn-sm" onclick="editShare('${share.file_id}')">编辑</button>
                                <button class="btn btn-secondary btn-sm" onclick="copyShareLink('${share.raw_url}')">复制链接</button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    listEl.innerHTML = '<p class="text-center" style="color: var(--text-muted); padding: 40px;">暂无分享内容</p>';
                }
            } catch (e) {
                listEl.innerHTML = '<p class="text-center" style="color: var(--error);">加载失败</p>';
            }
        }

        // 查看分享
        function viewShare(fileId) {
            window.open('/raw/' + fileId, '_blank');
        }

        // 编辑分享
        async function editShare(fileId) {
            document.getElementById('editFileId').value = fileId;
            document.getElementById('editModal').classList.add('show');

            // 获取当前内容
            try {
                const res = await fetch('/api/share/' + fileId, {
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });
                const data = await res.json();
                if (res.ok && data.content) {
                    document.getElementById('editContent').value = data.content;
                }
            } catch (e) {}
        }

        // 关闭模态框
        document.getElementById('closeModal').addEventListener('click', () => {
            document.getElementById('editModal').classList.remove('show');
            document.getElementById('editForm').reset();
        });

        // 编辑上传
        const editUploadArea = document.getElementById('editUploadArea');
        const editFileInput = document.getElementById('editFileInput');

        editUploadArea.addEventListener('click', () => editFileInput.click());
        editFileInput.addEventListener('change', handleEditFile);

        async function handleEditFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            await submitEditFile(file);
        }

        // 提交编辑
        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const content = document.getElementById('editContent').value;
            if (!content.trim()) return;

            const blob = new Blob([content], { type: 'text/plain' });
            await submitEditContent(blob);
        });

        async function submitEditFile(file) {
            const fileId = document.getElementById('editFileId').value;
            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('/api/share/' + fileId + '/update', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + authToken },
                    body: formData
                });
                const data = await res.json();
                if (res.ok) {
                    showMessage('更新成功！', 'success');
                    document.getElementById('editModal').classList.remove('show');
                    loadShares();
                } else {
                    showMessage(data.error || '更新失败', 'error');
                }
            } catch (e) {
                showMessage('网络错误', 'error');
            }
        }

        async function submitEditContent(blob) {
            const fileId = document.getElementById('editFileId').value;

            try {
                const res = await fetch('/api/share/' + fileId + '/update', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + authToken,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ content: await blob.text() })
                });
                const data = await res.json();
                if (res.ok) {
                    showMessage('更新成功！', 'success');
                    document.getElementById('editModal').classList.remove('show');
                    loadShares();
                } else {
                    showMessage(data.error || '更新失败', 'error');
                }
            } catch (e) {
                showMessage('网络错误', 'error');
            }
        }

        // 复制链接
        function copyShareLink(url) {
            navigator.clipboard.writeText(url).then(() => {
                showMessage('链接已复制', 'success');
            });
        }

        // 工具函数
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatFileSize(bytes) {
            if (!bytes) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // 启动
        init();
    </script>
</body>
</html>
